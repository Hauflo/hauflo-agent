# Home Assistant integration quality scale — where the Hauflo agent stands (HA core review 29.10, rechecked against the
# code by audit 0.40, 17.11: every rule, marked honestly; «todo» where it isn't there yet).
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      The six actions (lock, off_in, unprotect, remove_alarms, intercom_answer, intercom_hangup) are registered in
      async_setup (CONFIG_SCHEMA: config entry only) and stay for HA's whole run; with no loaded entry each raises a
      translated ServiceValidationError «not_loaded» (tests/test_actions_setup.py).
  appropriate-polling:
    status: exempt
    comment: No polling — one push link to Hauflo; the entities are updated by dispatcher and state events.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow:
    status: done
    comment: UI setup only. Every field of every step (user, reauth_confirm, reconfigure, ranges, relink_ranges, the folded «Advanced» server) has a data_description; the transfer step is a menu without fields.
  dependency-transparency:
    status: done
    comment: No requirements (only Home Assistant's own aiohttp).
  docs-actions:
    status: done
    comment: README «Actions» (EN and RU) — each action, who may call it, its fields; services.yaml and translations name every field.
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: README «Updating and removing» — what removal takes, what it leaves (and how to remove that by hand), «Leaving Hauflo».
  docs-triggers:
    status: exempt
    comment: No device triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The pairing code is checked with the Hauflo server in the config flow.
  test-before-setup:
    status: exempt
    comment: The link to Hauflo reconnects by itself with backoff; the house and the agent's local parts work offline, and «Link» says so.
  unique-config-entry:
    status: done
    comment: single_config_entry in the manifest.
  # Silver
  action-exceptions:
    status: done
    comment: >-
      Wrong input → ServiceValidationError, a failure in HA → HomeAssistantError, all translated: lock (unknown lock,
      no rights, can't open, the lock refused), off_in (not a light, unknown light), unprotect (nothing found — nothing changed), remove_alarms (hand-formatted
      automations.yaml, write failed), intercom_answer / intercom_hangup (unknown door, the call's own refusals); no entry loaded →
      «not_loaded». Admin-only actions raise Unauthorized.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README «Options» — «Allow Hauflo to change this site's setup», the allowed KNX group addresses, «Make the site independent».
  docs-installation-parameters:
    status: done
    comment: README «Install» — the pairing code, the optional server, the takeover checkbox, the KNX addresses.
  entity-unavailable:
    status: exempt
    comment: >-
      «Link» is the link's own state (on / off, never unavailable). Rule and daylight entities are computed by the
      agent from HA state; a missing source gives the rule's safe state (see rules.py), not an error.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      The lost link is logged once and its return once; a part of the agent that HA took away or that failed is logged
      once with its traceback, repeats go to debug, and its success clears it (issues.degrade / recover).
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 on every platform (push entities).
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >-
      Measured in CI per module (pytest-cov, no gate yet) — 85 % of lines overall, config flow 98 %; below 95 % —
      the tunnel (__init__ 69 %), the notify engine (77 %), voice (44 %).
  # Gold
  devices:
    status: done
    comment: One service device «Hauflo» carries all the agent's entities.
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud link paired by code — nothing to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: done
    comment: README «How data updates».
  docs-examples:
    status: todo
    comment: >-
      No examples section yet (audit 0.40: the README had none); the entities table names what the client's own
      automations can use (Site status, Site problem, rules), the actions table their calls.
  docs-known-limitations:
    status: done
    comment: README «Known limitations».
  docs-supported-devices:
    status: exempt
    comment: It manages no hardware of its own; KNX devices go through Home Assistant's KNX integration (its list of supported interfaces).
  docs-supported-functions:
    status: done
    comment: README «Entities the integration creates» and the feature sections.
  docs-troubleshooting:
    status: done
    comment: README questions under «Security in plain words» (code wrong or expired, silent actuator, old HA, the panel after an update).
  docs-use-cases:
    status: todo
    comment: >-
      No use-case section yet (audit 0.40: the «For the family» / «For you, the integrator» sections named here don't
      exist); the intro and the FAQ say what it is for.
  dynamic-devices:
    status: exempt
    comment: One service device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      No noisy or rarely used entities — «Link» is the agent's one health signal; rule entities exist only for the
      rules the integrator created (the retired comfort floor's entities are removed by retired.py).
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      Every HomeAssistantError / ServiceValidationError the agent raises has a translation key with its text in
      strings.json, en and ru — checked by tests/test_actions_setup.py over the source (no bare text left). Internal
      exceptions (PermissionError of a scene's learn target, RuntimeError of a missing helper or of a release without
      its alarm texts) never reach a person: they are caught and told in the agent's own answer or log.
  icon-translations:
    status: done
    comment: icons.json for the rule, daylight, ownership and derived entities; «Link» takes its icon from its device class.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Repairs only for what a person can act on: a link lost for hours, an unlinked agent (re-authenticate), KNX
      addresses waiting for the owner (fix flow → Configure), parts skipped because something of HA's is missing or
      changed («degraded») apart from parts of the agent's own that failed («agent_fault»: update the agent), an
      outdated agent, an outdated or newer-agent-needing cards plugin, an unsigned update refused. Each is cleared
      when its cause is gone.
  stale-devices:
    status: exempt
    comment: One service device.
  # Platinum
  async-dependency:
    status: exempt
    comment: No dependency library.
  inject-websession:
    status: done
    comment: Home Assistant's own client session (async_get_clientsession).
  strict-typing:
    status: todo
    comment: Typed, but not checked with mypy --strict yet.
